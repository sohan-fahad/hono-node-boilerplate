  #   container_name: hono-app-dev
  #   restart: unless-stopped
  #   ports:
  #     - "${PORT:-3000}:3000"
  #   environment:
  #     NODE_ENV: development
  #     PORT: ${PORT:-3000}
  #     DATABASE_URL: postgresql://admin:123456@postgres:5432/${POSTGRES_DB:-hono_db}
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #     REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
  #     JWT_SECRET: ${JWT_SECRET:-dev-secret}
  #     JWT_EXPIRATION: ${JWT_EXPIRATION:-1h}
  #     JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret}
  #     JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
  #     JWT_RESET_SECRET: ${JWT_RESET_SECRET:-dev-reset-secret}
  #     JWT_RESET_EXPIRATION: ${JWT_RESET_EXPIRATION:-1h}
  #   volumes:
  #     # Mount source code for hot reload
  #     - ./src:/app/src
  #     - ./package.json:/app/package.json
  #     - ./tsconfig.json:/app/tsconfig.json
